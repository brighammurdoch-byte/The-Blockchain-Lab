rea></div></div><div class="form-group" id="state"><label class="col-sm-2 control-label" for="block1chain1hash">Hash:</label><div class="col-sm-10"><input class="form-control" id="block1chain1hash" type="text" disabled></div></div><div class="form-group"><div class="col-sm-2"><i class="icon-spinner icon-spin icon-large"></i></div><div class="col-sm-10"><button class="btn btn-primary ladda-button" id="block1chain1mineButton" data-style="expand-right"><span class="ladda-label">Mine</span></button></div></div></form></div></div><script>$(function() {
  $('#block1chain1number').bind('input propertychange', function() { updateHash(1, 1); });
  $('#block1chain1nonce').bind('input propertychange', function() { updateHash(1, 1); });
  $('#block1chain1data').bind('input propertychange', function() { updateHash(1, 1); });
  mineButtonAnimation(1, 1);
  updateHash(1, 1);
});

function getText(block, chain) {
  return $('#block'+block+'chain'+chain+'number').val() +
         $('#block'+block+'chain'+chain+'nonce').val() +
         $('#block'+block+'chain'+chain+'data').val();
}

function mineButtonAnimation(block, chain) {
  $('#block'+block+'chain'+chain+'mineButton').click(function(e) {
      e.preventDefault();
      var l = Ladda.create(this);
      l.start();
      setTimeout(function() {
          mine(block, chain, false);
          l.stop();
        }, 250); // give UI time to update
    });
}</script></body></html>
